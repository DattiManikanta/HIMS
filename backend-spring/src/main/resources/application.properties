# ==============================================================================
# INDUS HEALTH CITY - HOSPITAL HIMS SPRING BOOT BACKEND CONFIGURATION
# ==============================================================================

server.port=5000

# MySQL Database DataSource (AWS RDS MySQL Cluster or local MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:atri.cluster-ro-cdk4i6gkepve.ap-south-1.rds.amazonaws.com}:${DB_PORT:3306}/${DB_DATABASE:at_healthcity}?allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=3000&socketTimeout=3000
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:Client123}

# Connection Pool Settings (HikariCP)
# -1 ensures Spring Boot starts immediately without blocking if DB is offline/unreachable
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Logging
logging.level.root=INFO
logging.level.com.healthcity=INFO
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.web=INFO
